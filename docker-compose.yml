# 개발 · 시연용 구성
#
#   docker compose up --build        전체 실행. 화면은 http://127.0.0.1:8080 (Swagger: http://127.0.0.1:8080/api/docs/)
#   docker compose up -d db mq       DB와 큐만 켠다 (백엔드와 화면은 직접 실행하는 개발용)
#   docker compose down -v           모두 끄고 DB 데이터도 지운다
#
# 시연 데이터를 넣지 않으려면 프로젝트 폴더의 .env에 SEED_DEMO=0 을 적는다.
# NVD API 키는 이 파일에 쓰지 않는다. 같은 .env에 NVD_API_KEY=값 으로 두면 compose가 읽는다.

x-backend: &backend
  build: ./backend
  image: mini-patch-manager-backend
  environment: &backend-env
    DJANGO_DEBUG: "0"
    # 로컬 시연용 값이다. 실제로 배포한다면 반드시 바꾼다.
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-compose-demo-secret-key-change-me}
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,frontend
    POSTGRES_HOST: db
    CELERY_BROKER_URL: amqp://guest:guest@mq:5672//
    NVD_API_KEY: ${NVD_API_KEY:-}
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    # 1이면 에이전트 보고를 큐에 넣지 않고 요청 안에서 바로 처리한다. "Celery 없이"와 비교하는 부하 테스트용이며 켜지 않는다.
    AGENT_REPORT_SYNC: ${AGENT_REPORT_SYNC:-0}
    # 시연용 패치 파일을 두는 곳(Nginx와 같은 볼륨)
    PATCH_FILE_DIR: /srv/patches
    # 컨테이너 안에서 가상 PC(simulate_agents)를 돌릴 때의 서버 주소. 패치 파일은 Nginx가 내려주므로 Nginx를 거친다.
    SIMULATOR_BASE: http://frontend
  volumes:
    - patchfiles:/srv/patches
  depends_on: &backend-depends
    db:
      condition: service_healthy
    init:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: patch
      POSTGRES_USER: patch
      POSTGRES_PASSWORD: patch
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patch -d patch"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # 처음 한 번만 실행되고 끝난다: DB 표 만들기(마이그레이션) + 시연 데이터. 나머지 서비스는 이것이 성공한 뒤에 시작한다.
  init:
    <<: *backend
    environment:
      <<: *backend-env
      SEED_DEMO: ${SEED_DEMO:-1}
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        python3.12 manage.py migrate --noinput
        if [ "$$SEED_DEMO" = "1" ]; then
          python3.12 manage.py seed_demo
          python3.12 manage.py seed_sample_patches
          # 패치마다 시연용 파일(기본 2MB)을 만들고 크기와 sha256을 기록한다. Nginx가 /patches/로 내려준다.
          python3.12 manage.py make_patch_files
          # 시연용 실제 CVE 5개를 NVD에서 가져온다 (대시보드의 취약한 PC 그래프에 쓰인다). 인터넷이 없어도 전체를 멈추지 않는다.
          python3.12 manage.py fetch_cves --cve-id CVE-2021-44228 CVE-2024-7971 CVE-2023-40031 CVE-2024-11477 CVE-2024-41869 \
            || echo "NVD에 연결하지 못해 시연용 CVE 가져오기를 건너뜁니다."
        fi
    restart: "no"

  backend:
    <<: *backend
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/groups/', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  worker:
    <<: *backend
    depends_on:
      <<: *backend-depends
      mq:
        condition: service_healthy
    # 동시에 처리하는 작업 수. 부하 테스트에서 바꿔 가며 비교한다 (CELERY_CONCURRENCY=8 docker compose up -d worker)
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "${CELERY_CONCURRENCY:-4}"]
    restart: unless-stopped

  beat:
    <<: *backend
    depends_on:
      <<: *backend-depends
      mq:
        condition: service_healthy
    command: ["celery", "-A", "config", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: mini-patch-manager-frontend
    ports: ["8080:80"]
    environment:
      # 패치 파일 내려받기 제한: 연결당 초당 속도(0이면 제한 없음)와 같은 주소의 동시 연결 수
      PATCH_RATE_LIMIT: ${PATCH_RATE_LIMIT:-1m}
      PATCH_MAX_CONN: ${PATCH_MAX_CONN:-2}
    volumes:
      - patchfiles:/srv/patches:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  patchfiles:
