# 화면(React 빌드 결과)을 서비스하고, API · 관리자 화면 · 정적 파일 요청은 백엔드(gunicorn)로 넘긴다.
# 브라우저 입장에서는 주소가 하나라 CORS 설정이 필요 없다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 백엔드로 넘기는 경로. /static/은 Django 관리자 화면의 CSS · JS(whitenoise가 서비스)다.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 파일 이름에 해시가 붙은 빌드 결과는 오래 캐시해도 된다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 나머지는 React 화면. 주소(/policies/1 등)를 새로고침해도 열리도록 index.html을 돌려준다.
    location / {
        try_files $uri /index.html;
    }
}
