name: CI

# main에 올라올 때와 pull request마다 자동으로 검사한다.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 브랜치에서 새로 푸시하면 이전 검사는 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 (린트 · 마이그레이션 · 테스트)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # 테스트는 실제 PostgreSQL에서 돌린다. 큐(RabbitMQ)는 필요 없다(테스트에서는 Celery를 바로 실행한다).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: patch
          POSTGRES_USER: patch
          POSTGRES_PASSWORD: patch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U patch -d patch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_HOST: localhost
      # 일부러 닿지 않는 주소: 테스트가 실수로 큐에 접속하려 하면 여기서 바로 실패한다
      CELERY_BROKER_URL: amqp://guest:guest@127.0.0.1:1//
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # 배포 이미지(Rocky Linux 9)와 같은 버전
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: 린트 (ruff)
        run: ruff check .
      - name: 설정 검사
        run: python manage.py check
      - name: 빠진 마이그레이션이 없는지
        run: python manage.py makemigrations --check --dry-run
      - name: 테스트
        run: python manage.py test patchmgr

  frontend:
    name: 화면 (린트 · 타입 검사 · 빌드)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 린트 (oxlint)
        run: npm run lint
      - name: 타입 검사와 빌드
        run: npm run build

  docker:
    name: Docker (이미지 빌드 · 한 줄 실행 확인)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: compose 설정 문법
        run: docker compose config -q
      # 인터넷 호출(NVD)이 없도록 시연 데이터 없이 켠다. 켜지는지와 주요 주소가 열리는지만 확인한다.
      - name: 전체 실행 (docker compose up --build)
        run: SEED_DEMO=0 docker compose up -d --build
      - name: 주요 주소가 열리는지
        run: |
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/groups/ > /dev/null; then break; fi
            sleep 3
          done
          check() { code=$(curl -s -o /dev/null -w "%{http_code}" "$1"); echo "$code $1"; [ "$code" = "200" ]; }
          check http://127.0.0.1:8080/
          check http://127.0.0.1:8080/policies
          check http://127.0.0.1:8080/api/groups/
          check http://127.0.0.1:8080/api/dashboard/summary/
          check http://127.0.0.1:8080/api/docs/
          check http://127.0.0.1:8080/admin/login/
          check http://127.0.0.1:8080/static/admin/css/base.css
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'
          # 패치 파일 경로: 시연 데이터가 없어 파일은 없지만, Nginx의 /patches/가 열려 있으면 없는 파일에 404를 돌려준다(502 · 500이 아님)
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/patches/patch-0.bin); echo "$code /patches/patch-0.bin"; [ "$code" = "404" ]
      - name: 실패했을 때 로그
        if: failure()
        run: docker compose logs --no-color --tail 80
      - name: 정리
        if: always()
        run: docker compose down -v
